kind = "web"
previewPath = "/"
title = "Feature Flag Manager"
version = "1.0.0"
id = "artifacts/feature-flags"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20765

[services.development]
run = "pnpm --filter @workspace/feature-flags run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/feature-flags", "run", "build" ]
serve = "static"
publicDir = "artifacts/feature-flags/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20765"
BASE_PATH = "/"
